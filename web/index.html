<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050509">
  <title>PlasmaTerm web-v0.1a</title>
  <meta name="description" content="The experimental v0.1a PlasmaTerm release, running in your browser through Python/WASM.">
  <meta property="og:title" content="PlasmaTerm web-v0.1a">
  <meta property="og:description" content="Python/WASM plasma in your browser.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://techrote.github.io/plasmaterm/web/og.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="PlasmaTerm web-v0.1a">
  <meta name="twitter:description" content="Python/WASM plasma in your browser.">
  <meta name="twitter:image" content="https://techrote.github.io/plasmaterm/web/og.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@6.0.0/css/xterm.css">
  <style>
    :root { color-scheme: dark; background: #050509; }
    * { box-sizing: border-box; }
    html, body, main, #terminal { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { background: radial-gradient(circle at 50% 45%, #12101d 0, #050509 55%); }
    main { padding: clamp(6px, 1vw, 12px); }
    #terminal { outline: none; }
    .xterm { height: 100%; padding: 0; }
    #status {
      position: fixed; inset: auto 16px 16px auto; z-index: 2;
      max-width: min(34rem, calc(100vw - 32px)); padding: 8px 11px;
      border: 1px solid #2d2940; border-radius: 7px;
      color: #c8c1db; background: rgb(9 8 15 / 88%);
      font: 12px/1.4 ui-monospace, SFMono-Regular, Consolas, monospace;
      transition: opacity 180ms ease;
    }
    #status[hidden] { display: block; opacity: 0; pointer-events: none; }
    #status.error { color: #ffd2d2; border-color: #723535; }
  </style>
</head>
<body>
  <main aria-label="PlasmaTerm terminal viewport">
    <div id="terminal" tabindex="0" aria-label="Animated PlasmaTerm viewport"></div>
  </main>
  <div id="status" role="status" aria-live="polite">Loading Python/WASM…</div>
  <script type="module" src="./plasma-browser.js"></script>
</body>
</html>
